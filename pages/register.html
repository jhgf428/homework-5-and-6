<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/styles.css">
    </head>
  <body>
    <header class="header">
      <nav>
        <ul class="menu-list">
          <li class="menu-item"><a class="menu-link" href="../index.html">На головну</a></li>
          <li class="menu-item"><a class="menu-link" href="#register">Реєстрація</a></li>
        </ul>
      </nav>
    </header>
    <main class="main">
      <section id="register">
        <h2 class="section-title">Реєстрація</h2>
        <form>
          <label>
            Ваше ім'я:
            <input type="text" name="name" id="name" />
          </label>
          <label>
            Оберіть пароль:
            <input type="password" name="password" id="password" />
          </label>
          <label>
            Електронна адреса:
            <input type="email" name="email" id="email" />
          </label>
          <label>
            Номер телефону:
            <input type="tel" name="phone-number" id="phone-number" />
          </label>
          <label>
            День нарождення:
            <input type="date" name="birthdate" id="birthdate" />
          </label>
          <label>
            "Аватар:
            <input type="file" name="avatar" id="avatar" />
          </label>
          <label>
            Чому ви вирішили доеднатися до нащої спільноти:
            <textarea name="questionnaire" rows="4" cols="30"></textarea>
          </label>
          <label>
            Яких тварин ви хочете бачити
            <select name="preferences">
              <option value="cat">Коти</option>
              <option value="dog">Собаки</option>
              <option value="bird">Птахи</option>
              <option value="none">Усіх</option>
            </select>
          </label>
          <fieldset class="fieldset-sex">
            <legend class="form-legend">Ваша стать</legend>
            <label><input type="radio" name="sex" value="male" />Чоловік</label>
            <label><input type="radio" name="sex" value="female" />Жінка</label>
          </fieldset>
          <fieldset class="fieldset-confidentiality">
            <legend>Персональні данні та конфіденційність</legend>
            <label>
              <input type="checkbox" name="privacy" value="confidentiality" />
              Погоджуюсь з умовами конфіденційності
            </label>
            <label>
              <input type="checkbox" name="license" value="personal-data" />
              Погоджуюсь з умовами обробки персональних данних
            </label>
          </fieldset>
          <button type="submit" class="button-submit">Зареєструватися</button>
          <button type="reset" class="button-reset">Заповнити заново</button>
        </form>
      </section>
    </main>
    <footer class="page-footer" id="contact">
      <address class="contacts">
        <a class="contacts-link" href="mailto:SamTheCat@gmail.com">SamTheCat@gmail.com</a>
        <a class="contacts-link" href="tel:+38074648294">+38074648294</a>
      </address>
    </footer>
  </body>
</html>
